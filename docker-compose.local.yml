# 本地测试部署：ivAdminWeb 前端
# 与 ivAdminApi / ivAppApi 共用 pixo-backend 网络，nginx 代理到 ivadmin-api:8000
services:
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on: []
    ports:
      - "8090:80"
    # 覆盖默认 nginx 配置：upstream 指向 pixo-backend 中的 ivadmin api 别名
    volumes:
      - ./deploy/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      pixo-backend:
        aliases:
          - ivadmin-web

networks:
  pixo-backend:
    external: true
