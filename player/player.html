<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Pipeline Lab Player</title>
    <link rel="stylesheet" href="./player.css">
  </head>
  <body>
    <main class="shell">
      <header>
        <a id="back-link" class="back-link" href="/" hidden>← 返回列表</a>
        <p class="eyebrow">PIPELINE LAB</p>
        <h1>Timeline Player</h1>
        <p id="meta">正在读取 Timeline…</p>
      </header>
      <section id="stage" class="stage" aria-label="互动视频播放器">
        <video id="video" playsinline preload="metadata"></video>
        <button id="surface" class="surface" type="button" aria-label="互动区域"></button>
        <div id="feedback" class="feedback-layer" aria-hidden="true"></div>
        <canvas id="fog" class="fog" hidden aria-hidden="true"></canvas>
        <div id="region-glow" class="region-glow" hidden aria-hidden="true"></div>
        <div id="gate" class="gate" hidden>
          <span id="cue-index" class="cue-index">01</span>
          <span class="cue-copy">
            <strong id="cue-title"></strong>
            <span id="cue-detail"></span>
            <button id="enable-sensor" class="enable-sensor" type="button" hidden>启用传感器</button>
          </span>
        </div>
        <button id="continue" class="continue-control" type="button" hidden>继续播放</button>
        <div id="seq-chip" class="seq-chip" hidden></div>
        <div id="beat-field" class="beat-field" hidden></div>
        <span id="combo" class="combo" hidden></span>
        <div id="pan-hint" class="pan-hint" hidden>
          <span class="pan-hint-arrows" aria-hidden="true">&lsaquo;&ensp;&rsaquo;</span>
          倾斜或拖动环顾画面
        </div>
        <div id="capability-dock" class="capability-dock" hidden>
          <video id="camera-video" muted playsinline hidden></video>
          <span id="capability-label" class="capability-label" hidden></span>
        </div>
        <div id="start-overlay" class="overlay">
          <button id="start" class="overlay-action" type="button">开始播放</button>
        </div>
        <div id="end-overlay" class="overlay" hidden>
          <button id="end-replay" class="overlay-action" type="button">再看一次</button>
        </div>
      </section>
      <div class="rail">
        <div id="rail-track" class="rail-track">
          <div id="rail-fill" class="rail-fill"></div>
          <div id="rail-markers" class="rail-markers"></div>
        </div>
      </div>
      <footer>
        <span id="progress" class="progress">0 / 0</span>
        <button id="replay" type="button">重新播放</button>
      </footer>
      <section id="process-view" class="process-view" hidden></section>
    </main>
    <script type="module" src="./player.js"></script>
    <script type="module" src="./process-view.js"></script>
  </body>
</html>
