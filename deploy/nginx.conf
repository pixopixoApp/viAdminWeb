server {
    listen 80;
    client_max_body_size 520m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    root /usr/share/nginx/html;
    index index.html;

    # Keep the collection endpoint on its canonical no-slash URL. Without this
    # exact match nginx auto-redirects it to a trailing slash because of the
    # prefix location below; behind the TLS proxy that redirect incorrectly
    # points at http:// and browsers reject it as mixed content.
    location = /api/v1/html-imports {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location ^~ /api/v1/html-imports/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
    }

    location /player/ {
        alias /usr/share/nginx/player/;
        try_files $uri $uri/ /player/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
