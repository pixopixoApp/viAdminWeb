server {
    listen 80;
    client_max_body_size 3g;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;

    root /usr/share/nginx/html;
    index index.html;

    # HTML must be revalidated on every navigation so a tab opened before a
    # rolling deploy cannot keep calling an incompatible API contract.  Vite
    # assets are content-hashed and can be cached permanently.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Keep the collection endpoint on its canonical no-slash URL. Without this
    # exact match nginx auto-redirects it to a trailing slash because of the
    # prefix location below; behind the TLS proxy that redirect incorrectly
    # points at http:// and browsers reject it as mixed content.
    location = /api/v1/html-imports {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location ^~ /api/v1/html-imports/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # API responses opt into this internal path with X-Accel-Redirect. nginx
    # then handles Range/sendfile directly while the cache itself stays private.
    location ^~ /__local_media/ {
        internal;
        alias /data/media-cache/objects/;
        sendfile on;
        tcp_nopush on;
        add_header Cache-Control "private, max-age=3600" always;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Local-Media-Accel 1;
        proxy_request_buffering off;
    }

    location /player/ {
        alias /usr/share/nginx/player/;
        try_files $uri $uri/ /player/index.html;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
